<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>flag pipeline test</title></head>
  <body>
    <div id="out">running...</div>
    <script>
      window.saveAs = function (blob, name) {
        window.__saveCalled = true;
        window.__saveName = name;
        var reader = new FileReader();
        reader.onload = function () {
          window.__captured = { name: name, data: reader.result };
          document.getElementById('out').textContent = 'captured:' + name;
        };
        reader.onerror = function (e) {
          document.getElementById('out').textContent = 'capture-error';
        };
        try { reader.readAsDataURL(blob); } catch (e) { document.getElementById('out').textContent = 'capture-error'; }
      };
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
